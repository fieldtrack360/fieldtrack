# Daemon JVM criteria.
#
# 17, matching `javaTarget` in the version catalog and the `jvmToolchain(17)` every module
# compiles with. This used to say 25, with `toolchainUrl.*` entries pointing at foojay
# redirects for a JDK 25 build, so every environment that did not already have one
# downloaded a second JDK and ran the daemon and the Kotlin compiler on it. On JitPack
# that meant paying for a JDK download and a second JVM's memory on a container that was
# already being OOM-killed, while `jdk: openjdk17` in jitpack.yml sat unused.
#
# No `toolchainUrl.*` entries: with the version matching what the build already targets,
# the launcher JVM satisfies the criteria on CI, and locally Gradle detects an installed
# 17 (including one under ~/.gradle/jdks). If none is found the build says so, which is a
# better failure than silently provisioning a JDK nothing asked for.
#
# Regenerate with `./gradlew updateDaemonJvm --jvm-version=<n>` — that needs toolchain
# download repositories configured in settings, which this build deliberately does not do.
toolchainVersion=17
